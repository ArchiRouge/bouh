<!doctype html><meta charset="utf-8"><body style="margin:0;background:#1e2036">
<canvas id="out"></canvas>
<script>
/* Maquette v2 — héros « héroïques » (≈3,5 têtes) à couches + éléments, monstres. Prototype hors jeu.
   Grille HD 48×96 pour les héros (24×48 pixels de jeu affichés en 2×). */
const rgb = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const R = a => a.map(rgb), mix = (a,b,t) => [0,1,2].map(i => Math.round(a[i]+(b[i]-a[i])*t));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const BAY = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v => (v+.5)/16-.5);
const ramp = (r,v,x,y) => r[clamp(Math.round(clamp(v,0,1)*(r.length-1)+BAY[((y&3)<<2)|(x&3)]*0.35),0,r.length-1)];
class Pix { constructor(w,h){this.w=w;this.h=h;this.c=document.createElement('canvas');this.c.width=w;this.c.height=h;this.g=this.c.getContext('2d');this.im=this.g.createImageData(w,h);this.d=this.im.data;}
  set(x,y,c,a){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h||!c)return;const k=(y*this.w+x)*4;this.d[k]=c[0];this.d[k+1]=c[1];this.d[k+2]=c[2];this.d[k+3]=a==null?255:a;}
  blend(x,y,c,al){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;const k=(y*this.w+x)*4,a0=this.d[k+3]/255,a=al+a0*(1-al);if(a<=0)return;for(let i=0;i<3;i++)this.d[k+i]=Math.round((c[i]*al+this.d[k+i]*a0*(1-al))/a);this.d[k+3]=Math.round(a*255);}
  a(x,y){return x<0||y<0||x>=this.w||y>=this.h?0:this.d[(y*this.w+x)*4+3];}
  done(){this.g.putImageData(this.im,0,0);return this.c;} }
function ell(P,cx,cy,rx,ry,fn){for(let y=Math.floor(cy-ry-1);y<=Math.ceil(cy+ry+1);y++)for(let x=Math.floor(cx-rx-1);x<=Math.ceil(cx+rx+1);x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry;if(nx*nx+ny*ny<=1){const c=fn(x,y,nx,ny);if(c)P.set(x,y,c);}}}
function poly(P,pts,fn){let y0=1e9,y1=-1e9;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+.5,xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]));}if(xs.length<2)continue;const xa=Math.min(...xs),xb=Math.max(...xs);for(let x=Math.ceil(xa-.5);x<=Math.floor(xb-.5);x++){const c=fn(x,y,(x+.5-xa)/Math.max(1,xb-xa));if(c)P.set(x,y,c);}}}
const rect=(P,x0,y0,x1,y1,fn)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const c=fn(x,y,(x-x0)/Math.max(1,x1-x0),(y-y0)/Math.max(1,y1-y0));if(c)P.set(x,y,c);}};
const cyl=(r,t,x,y,b)=>ramp(r,(b==null?0.62:b)-t*0.55,x,y);
function finish(P,glowCol){ const d=P.d,w=P.w,h=P.h,A=(x,y)=>x<0||y<0||x>=w||y>=h?0:d[(y*w+x)*4+3];
  const lit=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(A(x,y)>200&&(A(x-1,y)<200||A(x,y-1)<200))lit.push(y*w+x);
  for(const k of lit){const q=k*4;for(let i=0;i<3;i++)d[q+i]=Math.min(255,d[q+i]*.8+[255,250,235][i]*.2);}
  const add=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(A(x,y)<200&&(A(x+1,y)>200||A(x-1,y)>200||A(x,y+1)>200||A(x,y-1)>200))add.push(y*w+x);
  for(const k of add){const q=k*4;d[q]=30;d[q+1]=16;d[q+2]=40;d[q+3]=255;}
  return P.done(); }

/* ---------- palettes ---------- */
const SKINS={light:R(['#7a4436','#b8735c','#dca07e','#f2c4a2','#fde0c6']),tan:R(['#5a3024','#8e5440','#b87a5a','#d8a07a','#eec09a']),dark:R(['#2e1a1a','#523026','#764634','#9a6446','#b8845e'])};
const HAIRS={brown:R(['#2a1820','#4a2a2c','#6e4232','#9a6444','#c08c62']),red:R(['#3a1418','#6a2420','#a03a28','#d0603a','#f09060']),silver:R(['#4a4a62','#7a7a96','#a8a8c4','#d4d4e6','#f4f4fc']),black:R(['#12101c','#22202e','#36324a','#4e4a66','#6e6888'])};
const EYE=rgb('#2a1428'),WHITE=rgb('#f6f0e6'),LIP=rgb('#a45a5c'),LIPF=rgb('#c45a6a');
const STEEL=R(['#363852','#5a5e7c','#8890ae','#bcc4da','#eef2fa']);
const SILVER=R(['#4a4e66','#7a80a0','#aab2cc','#d6dcec','#ffffff']);
const GOLD=R(['#6a4416','#a8721e','#e0a83a','#f8d878','#fff4c0']);
const LINEN=R(['#5e5048','#8c7868','#b8a48a','#dccab0','#f4e8d2']);
const LEATHER=R(['#3a2220','#5e3628','#86503a','#aa7050','#c89470']);
const DARKL=R(['#1e1a20','#2e2830','#443a40','#5e5054']);
const PANTS=R(['#2a2430','#3e3446','#584a5e','#76687a']);
const MAIL=R(['#3a3c52','#5c6078','#8a90a8','#b8c0d4']);
// éléments
const EL={
  eau:{main:R(['#14243e','#1e3a62','#2e5a8a','#4a86b0','#7ab4d0','#bce0ec']),trim:SILVER,gem:rgb('#6ad8f0'),glow:[120,220,255],name:'Eau',sym:'eau'},
  feu:{main:R(['#3a1218','#6a1e22','#a03a2c','#d0603e','#f0904e','#ffc080']),trim:GOLD,gem:rgb('#ff6a3a'),glow:[255,140,80],name:'Feu',sym:'feu'},
  bois:{main:R(['#14301e','#1e4a2a','#2e6a36','#4a8c44','#7aae5a','#b4d47e']),trim:R(['#4a3016','#7a5226','#a87a3a','#d0a85a']),gem:rgb('#9cf070'),glow:[170,240,140],name:'Bois',sym:'bois'},
  lumiere:{main:R(['#6a5a4a','#a89878','#d8ccb0','#f2ead6','#fffaf0','#ffffff']),trim:GOLD,gem:rgb('#fff0a0'),glow:[255,240,180],name:'Lumière',sym:'lum'},
  tenebres:{main:R(['#120e1e','#221a36','#36284e','#4e3a6a','#6e5290','#9478b8']),trim:R(['#2a2440','#4a4468','#8a84b0','#c8c4e8']),gem:rgb('#c47cff'),glow:[190,120,255],name:'Ténèbres',sym:'ten'}
};
const CAPE_RED=R(['#3a0e18','#5e1624','#8a2232','#b4384a']);

/* ---------- corps ---------- */
const BODY={
  homme:{sh:[13,35],arm:5,waist:[16,32],hip:[16,32],legs:[[17,23],[25,31]],neck:[21,27],head:[8.2,11],skin:'light',hair:'brown',hairStyle:'court'},
  femme:{sh:[15,33],arm:4,waist:[18,30],hip:[15,33],legs:[[17,22],[26,31]],neck:[22,26],head:[7.7,10.4],skin:'tan',hair:'red',hairStyle:'long',fem:1},
  carrure:{sh:[11,37],arm:6,waist:[14,34],hip:[15,33],legs:[[16,23],[25,32]],neck:[20,28],head:[8.6,10.8],skin:'dark',hair:'black',hairStyle:'rase',beard:1}
};
function armRanges(B){ return [[B.sh[0]-B.arm+1,B.sh[0]+1],[B.sh[1]-1,B.sh[1]+B.arm-1]]; }

/* ---------- héros de face ---------- */
function heroFront(P,B,O){
  const SK=SKINS[B.skin],HA=HAIRS[B.hair],arms=armRanges(B);
  // aura (légendaire)
  if(O.aura) for(let y=0;y<96;y++)for(let x=0;x<48;x++){const d=Math.hypot((x-24)/20,(y-46)/42);if(d<1)P.blend(x,y,O.aura,0.22*(1-d));}
  // cape (derrière)
  if(O.cape) poly(P,[[B.sh[0]+1,30],[B.sh[1]-1,30],[B.sh[1]+3,86],[B.sh[0]-3,86]],(x,y,t)=>ramp(O.cape,0.55-t*0.4-(y>80?0.15:0),x,y));
  // cheveux longs (derrière)
  if(B.hairStyle==='long') poly(P,[[15,12],[33,12],[35,44],[13,44]],(x,y,t)=>ramp(HA,0.6-t*0.4-(y-12)/80,x,y));
  // jambes (peau puis pantalon/armure)
  for(const [x0,x1] of B.legs) rect(P,x0,54,x1,84,(x,y,t)=>cyl(O.legs||PANTS,t,x,y));
  if(O.knee) for(const [x0,x1] of B.legs) ell(P,(x0+x1)/2,67,(x1-x0)/2+1.2,3.4,(x,y,nx,ny)=>ramp(O.knee,0.65-nx*0.3-ny*0.3,x,y));
  if(O.greaveTrim) for(const [x0,x1] of B.legs){ for(let x=x0;x<=x1;x++) P.set(x,71,O.greaveTrim[2]); }
  // pieds
  for(const [x0,x1] of B.legs){ rect(P,x0-1,O.tallBoots?73:79,x1+1,87,(x,y,t)=>cyl(O.feet||DARKL,t,x,y,y>84?0.35:0.62)); for(let x=x0-1;x<=x1+1;x++)P.set(x,88,(O.feet||DARKL)[0]); if(O.bootTrim) for(let x=x0-1;x<=x1+1;x++)P.set(x,O.tallBoots?73:79,O.bootTrim[2]); }
  // bras (peau)
  for(const [x0,x1] of arms) rect(P,x0,31,x1,51,(x,y,t)=>cyl(SK,t,x,y,0.6));
  // torse (peau)
  poly(P,[[B.sh[0],30],[B.sh[1],30],[B.waist[1],50],[B.hip[1],54],[B.hip[0],54],[B.waist[0],50]],(x,y,t)=>cyl(SK,t,x,y));
  // haut du corps : tunique / mailles / plastron
  const C=O.chest;
  const bodyPts=[[B.sh[0],29],[B.sh[1],29],[B.waist[1]+1,50],[B.hip[1]+1,C.skirt||56],[B.hip[0]-1,C.skirt||56],[B.waist[0]-1,50]];
  poly(P,bodyPts,(x,y,t)=>{ if(C.type==='mail'){ const ring=((x+(y>>1))&1)?0.55:0.75; return ramp(C.pal,ring-t*0.4,x,y);} return cyl(C.pal,t,x,y,0.66); });
  if(B.fem && C.type!=='plate') for(const cx of [20,28]) ell(P,cx,37,3.2,2.6,(x,y,nx,ny)=>ny>0.2?ramp(C.pal,0.35,x,y):null);
  if(C.type==='tunic'){ poly(P,[[21,29],[27,29],[24,35]],()=>SK[2]); for(let y=36;y<=(C.skirt||56);y++)P.set(24,y,C.pal[1]); if(C.embroid) for(let x=bodyPts[4][0]+1;x<bodyPts[3][0];x++) if((x&1)) P.set(x,(C.skirt||56)-1,C.embroid[2]); }
  if(C.tabard){ poly(P,[[19,34],[29,34],[29,62],[24,66],[19,62]],(x,y,t)=>cyl(C.tabard,t*0.6,x,y,0.62)); for(let y=34;y<=62;y++){P.set(19,y,C.trim[3]);P.set(29,y,C.trim[2]);} // motif vague
    for(let k=0;k<3;k++){const yy=44+k*5;for(let x=20;x<=28;x++)P.set(x,yy+Math.round(Math.sin((x+k)*1.2)),C.trim[3]);} }
  if(C.type==='plate'){
    for(let y=31;y<=50;y++){P.set(24,y,C.pal[4]);P.set(25,y,C.pal[1]);}
    ell(P,19,37,3,4,()=>C.pal[3]);
    // filigrane
    for(let x=B.sh[0]+1;x<=B.sh[1]-1;x++) P.set(x,29,C.trim[2]);
    if(C.filigree){ for(let y=30;y<=48;y+=3){ P.set(20,y,C.trim[3]); P.set(28,y,C.trim[3]); P.set(21,y+1,C.trim[2]); P.set(27,y+1,C.trim[2]); } }
    if(C.flames){ for(let x=17;x<=31;x++){ const yy=48-Math.abs(((x*3)%7)-3); P.set(x,yy,C.trim[2]); } }
  }
  if(C.gem){ ell(P,24.5,33,1.8,1.8,()=>C.gem); P.set(24,32,WHITE); }
  // tassettes
  if(O.tassets) for(const [a,b] of [[B.hip[0]-1,23],[25,B.hip[1]+1]]) poly(P,[[a,53],[b,53],[b-1,63],[a+1,63]],(x,y,t)=>cyl(O.tassets,t,x,y,0.7));
  // ceinture
  rect(P,B.waist[0]-1,50,B.waist[1]+1,53,(x,y)=>ramp(O.belt||LEATHER,y===50?0.85:0.45,x,y));
  if(O.buckle) rect(P,22,50,26,53,(x,y)=>ramp(O.buckle,(x===22||y===50)?0.95:0.55,x,y));
  // manches
  for(const [x0,x1] of arms) rect(P,x0-1,30,x1+1,O.sleeveEnd||42,(x,y,t)=>O.sleeve?cyl(O.sleeve,t,x,y):null);
  // mains / gantelets
  if(O.hands) for(const [x0,x1] of arms){ rect(P,x0-1,43,x1+1,51,(x,y,t)=>cyl(O.hands,t,x,y,y<45?0.9:0.62)); if(O.handTrim) for(let x=x0-1;x<=x1+1;x++)P.set(x,43,O.handTrim[2]); }
  for(const [x0,x1] of arms) ell(P,(x0+x1)/2,53.5,(x1-x0)/2+0.8,3.3,(x,y,nx,ny)=>ramp(O.hands||SK,0.6-nx*0.3-ny*0.2,x,y));
  // épaulières
  if(O.shoulders){ const S=O.shoulders; for(const [cx,s] of [[(arms[0][0]+arms[0][1])/2,-1],[(arms[1][0]+arms[1][1])/2,1]]){
      const big=S.size||1; ell(P,cx,33,5.5*big+B.arm*0.4,4.2*big+1,(x,y,nx,ny)=>ny<0.6?ramp(S.pal,0.75-nx*0.3-ny*0.35,x,y):null);
      if(S.layers) for(let k=1;k<=S.layers;k++) ell(P,cx+s*k,33+k*4,(5.5*big+B.arm*0.4)-k*1.2,3,(x,y,nx,ny)=>ny<0.4?ramp(S.pal,0.6-k*0.08-nx*0.3,x,y):null);
      if(S.trim){ const rx=5.5*big+B.arm*0.4; for(let x=Math.ceil(cx-rx);x<=Math.floor(cx+rx);x++){ const yy=Math.round(33-(4.2*big+1)*Math.sqrt(Math.max(0,1-((x+.5-cx)/rx)**2))); P.set(x,yy,S.trim[2]); } }
      if(S.spike) for(let k=0;k<5;k++){ P.set(cx+s*2,26+k,S.trim?S.trim[3-(k>2?1:0)]:S.pal[4]); if(k<3)P.set(cx+s*2+s,27+k,S.pal[3]); }
      if(S.gem) ell(P,cx,32,1.4,1.4,()=>S.gem);
  } }
  // tête
  const [hrx,hry]=B.head;
  rect(P,B.neck[0],24,B.neck[1],30,(x,y)=>ramp(SK,y<27?0.35:0.5,x,y));
  ell(P,24,15,hrx,hry,(x,y,nx,ny)=>ramp(SK,0.68-nx*0.25-ny*0.12-(ny>0.55?0.12:0),x,y));
  for(let y=19;y<=25;y++) for(let x=27;x<=32;x++) if(P.a(x,y)&&((x-24)/hrx)**2+((y-15)/hry)**2>0.62) P.set(x,y,SK[1]);
  P.set(24,25,SK[3]);
  if(!O.closedHelm){
    for(const ex of [19,27]){ P.set(ex,15,EYE);P.set(ex+1,15,EYE);P.set(ex+2,15,EYE);P.set(ex,16,WHITE);P.set(ex+1,16,O.eyeCol||rgb('#3e6a8c'));P.set(ex+2,16,EYE); if(B.fem){P.set(ex-1+(ex>24?4:0),14,EYE);} }
    for(const ex of [19,27]) for(let k=0;k<3;k++) P.set(ex+k,13,mix(HA[1],SK[1],.2));
    P.set(24,17,SK[3]);P.set(24,18,SK[2]);P.set(25,19,SK[1]);P.set(24,19,SK[2]);
    if(B.fem){P.set(23,21,LIPF);P.set(24,21,LIPF);} else {P.set(23,21,LIP);P.set(24,21,LIP);P.set(25,21,mix(LIP,SK[2],.5));}
    if(B.beard) ell(P,24,22.5,6.5,4.2,(x,y,nx,ny)=>ny>-0.4?ramp(HA,0.5-nx*0.3,x,y):null), P.set(23,21,LIP),P.set(24,21,LIP);
  }
  // cheveux
  if(!O.helm || O.helm.type==='circlet'){
    if(B.hairStyle==='rase') ell(P,24,9,8.6,6,(x,y,nx,ny)=>y<=10?ramp(HA,0.6-nx*0.35-ny*0.3,x,y):null);
    else { ell(P,24,10,9,7.6,(x,y,nx,ny)=>y<=12||(x<17||x>31)&&y<=(B.hairStyle==='long'?26:17)?ramp(HA,0.7-nx*0.35-ny*0.3,x,y):null);
      for(let x=17;x<=23;x++) P.set(x,13+((x-17)>>2),ramp(HA,0.55,x,13)); }
  }
  // couvre-chef
  if(O.helm){ const H=O.helm;
    if(H.type==='circlet'){ for(let x=16;x<=32;x++)P.set(x,10,H.trim[2]); ell(P,24.5,10,1.6,1.6,()=>H.gem||H.trim[3]); }
    if(H.type==='helm'||H.type==='winged'){
      ell(P,24,12,hrx+1.6,hry-0.5,(x,y,nx,ny)=>(y<=12||x<=18||x>=30)&&y<=22?ramp(H.pal,0.72-nx*0.3-ny*0.3,x,y):null);
      for(let y=12;y<=19;y++){P.set(24,y,H.pal[Math.min(4,H.pal.length-2)]);P.set(25,y,H.pal[1]);}
      for(let x=15;x<=33;x++) P.set(x,12,H.trim[2]);
      if(H.crest) rect(P,22,0,26,4,(x,y)=>ramp(H.crest,0.75-(x-22)*0.12,x,y));
      if(H.type==='winged') for(const s of [-1,1]) for(let k=0;k<9;k++){ const x=24+s*(10+k), y0=10-k; for(let y=y0;y<=y0+3+Math.floor(k/3);y++) P.set(x,y,ramp(H.trim,0.85-k*0.05-(y-y0)*0.1,x,y)); }
      if(H.gem){ ell(P,24.5,9,1.5,1.5,()=>H.gem); }
    }
  }
  // arme
  if(O.weapon) O.weapon(P);
}

/* ---------- héros de profil (vers la droite) ---------- */
function heroSide(P,B,O){
  const SK=SKINS[B.skin],HA=HAIRS[B.hair],C=O.chest,shade=(r)=>r.map(c=>mix(c,[20,14,30],0.3));
  if(O.aura) for(let y=0;y<96;y++)for(let x=0;x<48;x++){const d=Math.hypot((x-24)/20,(y-46)/42);if(d<1)P.blend(x,y,O.aura,0.22*(1-d));}
  if(O.cape) poly(P,[[17,30],[22,30],[18,86],[9,86]],(x,y,t)=>ramp(O.cape,0.45-t*0.3,x,y));
  if(B.hairStyle==='long') poly(P,[[16,12],[24,12],[22,44],[14,44]],(x,y,t)=>ramp(HA,0.55-t*0.3,x,y));
  // bras arrière
  rect(P,19,31,23,50,(x,y,t)=>ramp(shade(O.sleeve||SK),0.5,x,y));
  // jambes : arrière plus sombre, avant éclairée
  rect(P,19,54,24,84,(x,y)=>ramp(shade(O.legs||PANTS),0.45,x,y));
  rect(P,24,54,30,84,(x,y,t)=>cyl(O.legs||PANTS,t,x,y));
  if(O.knee) ell(P,28.5,67,3.6,3.6,(x,y,nx,ny)=>ramp(O.knee,0.65-nx*0.3-ny*0.3,x,y));
  for(const [x0,dark] of [[18,1],[23,0]]) rect(P,x0,O.tallBoots?74:80,x0+9,87,(x,y)=>ramp(dark?shade(O.feet||DARKL):(O.feet||DARKL),y>84?0.35:0.62,x,y)), rect(P,x0+7,84,x0+11,87,(x,y)=>ramp(dark?shade(O.feet||DARKL):(O.feet||DARKL),0.4,x,y));
  if(O.tassets) poly(P,[[19,53],[31,53],[31,63],[20,63]],(x,y,t)=>cyl(O.tassets,t,x,y,0.7));
  poly(P,[[18,29],[30,29],[32,40],[30,C.skirt||55],[19,C.skirt||55]],(x,y,t)=>{ if(C.type==='mail'){const ring=((x+(y>>1))&1)?0.55:0.75;return ramp(C.pal,ring-t*0.4,x,y);} return cyl(C.pal,t,x,y,0.66); });

function roiGelee(){ // boss Eau : grande gelée royale, cœur de cristal, couronne ornée, collerette de joyaux, orbes d'eau
