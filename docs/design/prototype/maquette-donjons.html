<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Maquette donjons</title>
<style>
body{margin:0;background:#120e22;color:#f4ead8;font:15px/1.35 Georgia,serif}
canvas{display:block;image-rendering:pixelated}
</style></head><body>
<canvas id="c"></canvas>
<script src="../../../client/core.js"></script>
<script src="../../../client/sprites.js"></script>
<script src="../../../client/assets.js"></script>
<script>
(() => {
const C0 = window.EtheriaCore, A = window.EtheriaArt, SPR = window.EtheriaSprites, C = Object.assign({}, C0, { hash: (x, y, s) => Math.floor(C0.hash(x, y, s) * 1e6) });
const WW = 1260, cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = WW; cv.height = 4200; g.imageSmoothingEnabled = false;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16 - 0.5);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---------- raretés de donjon (couleurs des objets du jeu) ---------- */
const TIERS = [
  { name: 'Commun', col: '#ece8f4', p: '45 %', n: 5, lvl: '+0', elite: 0, theme: 'Caveau', light: 1.0, beam: 40 },
  { name: 'Inhabituel', col: '#5ee870', p: '28 %', n: 7, lvl: '+1', elite: 1, theme: 'Racines', light: 0.9, beam: 60 },
  { name: 'Rare', col: '#5aa8ff', p: '17 %', n: 9, lvl: '+2', elite: 2, theme: 'Grotte de cristal', light: 0.8, beam: 85 },
  { name: 'Épique', col: '#c47cff', p: '8 %', n: 11, lvl: '+3', elite: 4, theme: 'Catacombes d\'Éther', light: 0.7, beam: 115 },
  { name: 'Légendaire', col: '#ffb43a', p: '2 %', n: 13, lvl: '+5', elite: 6, theme: 'Salle dorée', light: 0.62, beam: 150 }
];
const MYTH = '#ff4a7a';
// pierre de chaque thème (ombres violettes, lumières crème)
const THEME = [
  ['#1e1a2c', '#2e293e', '#423b54', '#5a526c', '#766e88', '#968ea6'],
  ['#18201e', '#24302a', '#334436', '#465a44', '#5e7454', '#7e9268'],
  ['#141a30', '#1e2844', '#2a3a5c', '#3a5076', '#506a92', '#7090b0'],
  ['#1a1230', '#271a44', '#36265a', '#483474', '#5e4890', '#7c66ac'],
  ['#241a18', '#36261e', '#4c3626', '#664a30', '#84643c', '#a8864e']
].map(a => a.map(hex));
const ramp = (pal, v, x, y) => pal[clamp(Math.round(clamp(v, 0, 1) * (pal.length - 1) + BAY[((y & 3) << 2) | (x & 3)] * 0.6), 0, pal.length - 1)];
const tierRamp = h => SPR.ramp5(h);

/* ---------- petit tampon de pixels ---------- */
class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.c = document.createElement('canvas'); this.c.width = w; this.c.height = h; this.x = this.c.getContext('2d'); this.im = this.x.createImageData(w, h); this.d = this.im.data; }
  set(x, y, c, a) { x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h || !c) return; const k = (y * this.w + x) * 4; this.d[k] = c[0]; this.d[k + 1] = c[1]; this.d[k + 2] = c[2]; this.d[k + 3] = a == null ? 255 : a; }
  a(x, y) { return x < 0 || y < 0 || x >= this.w || y >= this.h ? 0 : this.d[(y * this.w + x) * 4 + 3]; }
  outline(tint) { const add = []; for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { if (this.a(x, y)) continue; for (const [a, b] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) if (this.a(x + a, y + b) > 120) { add.push([x, y]); break; } } for (const [x, y] of add) this.set(x, y, tint || [40, 22, 52]); return this; }
  done() { this.x.putImageData(this.im, 0, 0); return this.c; }
}
const inDia = (x, y) => { const sx = x + 0.5 - 16, sy = y + 0.5 - 8; return Math.abs(sx) / 16 + Math.abs(sy) / 8 <= 1; };

/* ---------- tuiles du donjon ---------- */
function paintFloor(pal, v) {
  const P = new Pix(32, 16), r = C.mulberry32(v * 97 + 5);
  const crack = r() < 0.5;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 32; x++) {
    if (!inDia(x, y)) continue;
    const sx = x - 16 + 0.5, sy = y + 0.5, du = (sx / 16 + sy / 8) / 2, dv = (sy / 8 - sx / 16) / 2;
    const su = (du * 2) % 1, sv = (dv * 2) % 1, seam = su < 0.07 || sv < 0.07;
    const fl = Math.floor(du * 2) + Math.floor(dv * 2) * 2, sh = [0.55, 0.45, 0.5, 0.4][fl & 3] + (C.hash(v, fl) % 10) / 60;
    let t = seam ? 0.3 : 0.2 + sh + (su > 0.9 || sv > 0.9 ? -0.12 : su < 0.2 || sv < 0.2 ? 0.1 : 0);
    if (crack && Math.abs(du - dv * 0.6 - 0.3) < 0.025 && du > 0.2 && du < 0.7) t = 0.3;
    P.set(x, y, mix(ramp(pal, t, x, y), [236, 220, 200], 0.12));
  }
  return P.done();
}
const WH = 22;
function paintWall(pal, tier, v, wh) {
  const WH = wh || 22, P = new Pix(32, 16 + WH), acc = tierRamp(TIERS[tier].col);
  for (let y = 0; y < 16 + WH; y++) for (let x = 0; x < 32; x++) {
    const top = inDia(x, y);
    if (top) { // dessus du mur : sombre, bord avant éclairé
      const sy = y + 0.5 - 8, sx = x + 0.5 - 16, e = Math.abs(sx) / 16 + Math.abs(sy) / 8;
      P.set(x, y, e > 0.8 && sy > 0 ? pal[3] : ramp(pal, 0.04 + (C.hash(x >> 2, y >> 1) % 4) / 40, x, y));
      continue;
    }
    // faces : gauche (x < 16) et droite
    const yy = y - WH;
    const left = x < 16;
    const yTop = left ? 8 + (x + 0.5) / 2 : 8 + (32 - x - 0.5) / 2; // bord supérieur de la face (sous le dessus)
    if (y < yTop || y > yTop + WH) continue;
    const fy = y - yTop, row = Math.floor(fy / 5), bx = Math.floor((left ? x : 32 - x) / 6 + (row % 2) * 0.5);
    const mortar = fy % 5 < 1 || ((left ? x : 32 - x) + (row % 2) * 3) % 6 < 1;
    let t = left ? 0.5 : 0.3; t += ((C.hash(bx, row + v * 7) % 5) - 2) / 30; if (mortar) t -= 0.22; if (fy > WH - 3) t -= 0.12;
    P.set(x, y, ramp(pal, t, x, y));
    void yy;
  }
  // rune de rareté sur certaines faces
  if (v % 3 === 0 && tier >= 2 && WH > 10) for (const [x, y] of [[23, 22], [24, 21], [25, 22], [24, 23], [24, 24]]) P.set(x, y, acc[3]);
  P.outline([20, 12, 34]);
  return P.done();
}
function paintTorch(f) {
  const P = new Pix(7, 13), fl = [hex('#a0301a'), hex('#ff7a2a'), hex('#ffc048'), hex('#fff4c0')];
  for (let y = 8; y < 13; y++) P.set(3, y, hex('#4a2c1c')); P.set(2, 8, hex('#6a4028')); P.set(4, 8, hex('#6a4028'));
  const h = f ? [[3, 1], [2, 2], [3, 2], [4, 3], [2, 3], [3, 3], [2, 4], [3, 4], [4, 4], [2, 5], [3, 5], [4, 5], [3, 6], [3, 7]] : [[3, 0], [3, 1], [4, 2], [3, 2], [2, 3], [3, 3], [4, 3], [2, 4], [3, 4], [4, 4], [2, 5], [3, 5], [4, 5], [3, 6], [3, 7]];
  for (const [x, y] of h) P.set(x, y, fl[y < 2 ? 1 : y > 5 ? 0 : 2]); P.set(3, 4, fl[3]); P.set(3, 5, fl[3]);
  return P.done();
}
function paintSpikes(up, pal) {
  const P = new Pix(32, 16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 32; x++) if (inDia(x, y)) { const sx = x - 16 + 0.5, sy = y - 8 + 0.5; if (Math.abs(sx) / 16 + Math.abs(sy) / 8 < 0.7) P.set(x, y, (x + y) % 4 === 0 ? pal[0] : pal[1]); }
  if (up) for (const [cx, cy] of [[10, 8], [16, 5], [22, 8], [16, 11], [13, 8], [19, 8]]) for (let k = 0; k < 6; k++) { P.set(cx, cy - k, hex(k > 3 ? '#e8ecf4' : '#9aa0b8')); if (k < 2) P.set(cx + 1, cy - k, hex('#5a6078')); }
  return P.done();
}
function paintCrystal(col) {
  const P = new Pix(9, 16), r = tierRamp(col);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 9; x++) { const w = y < 8 ? y * 0.55 : (16 - y) * 0.3; if (Math.abs(x - 4) <= w) P.set(x, y, x < 4 ? r[3] : x === 4 ? r[4] : r[1]); }
  P.set(3, 4, [255, 255, 255]); return P.outline().done();
}
function paintChest(tier, open) {
  const P = new Pix(18, 15), w = ['#3a2014', '#5e3820', '#8a5630', '#b07a44', '#d8a868'].map(hex), tr = tierRamp(TIERS[tier].col);
  for (let y = open ? 6 : 3; y < 14; y++) for (let x = 1; x < 17; x++) P.set(x, y, y === (open ? 6 : 3) ? w[4] : x < 4 ? w[3] : x > 14 ? w[1] : w[2]);
  for (let x = 1; x < 17; x++) { P.set(x, open ? 8 : 7, tr[2]); P.set(x, 13, w[0]); }
  for (let y = 3; y < 14; y++) { P.set(1, y, tr[1]); P.set(16, y, tr[1]); }
  if (open) for (let x = 3; x < 15; x++) { P.set(x, 7, hex('#fff6c0')); P.set(x, 1, w[3]); P.set(x, 2, w[2]); }
  else { P.set(8, 6, tr[4]); P.set(9, 6, tr[3]); P.set(8, 8, tr[0]); P.set(9, 8, tr[0]); }
  return P.outline().done();
}

/* ---------- l'entrée au centre de l'île ---------- */
const STONE = ['#3c3a5c', '#504e70', '#666486', '#7e7c9c', '#9a98b6', '#c0bdd6'].map(hex);
function paintEntrance(tier, f) {
  const T = TIERS[tier], tr = tierRamp(T.col), W = 72, H = 84, P = new Pix(W, H), cx = 36, base = 62;
  const gold = tierRamp('#ffd04a');
  // anneau de lueur au sol
  for (let y = base - 14; y < base + 22; y++) for (let x = 0; x < W; x++) { const e = Math.abs(x + 0.5 - cx) / 35 + Math.abs(y + 0.5 - base - 4) / 17.5; if (e > 0.86 && e <= 1 && (x + y + f) % 3 !== 0) P.set(x, y, tr[e > 0.93 ? 1 : 2], 200); }
  // plateforme losange surélevée (4 px)
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const sx = x + 0.5 - cx, syT = y + 0.5 - (base - 4), eT = Math.abs(sx) / 28 + Math.abs(syT) / 14;
    if (eT <= 1) { P.set(x, y, ramp(STONE, 0.55 + (Math.floor((sx / 28 + syT / 14) * 3) + Math.floor((syT / 14 - sx / 28) * 3)) % 2 * 0.15 - (eT > 0.9 ? 0.2 : 0), x, y)); continue; }
    const syB = y + 0.5 - base, eB = Math.abs(sx) / 28 + Math.abs(syB) / 14;
    if (eB <= 1 && syB > -2 && y > base - 4 + (14 * (1 - Math.abs(sx) / 28)) - 0.5) P.set(x, y, sx < 0 ? STONE[2] : STONE[1]);
  }
  // escalier qui descend dans le noir
  for (let k = 0; k < 5; k++) for (let x = cx - 11 + k; x <= cx + 11 - k; x++) { const y = base - 6 - k * 2; P.set(x, y, k < 2 ? STONE[3 - k] : [24 - k * 3, 16 - k * 2, 40 - k * 4]); P.set(x, y + 1, k < 2 ? STONE[1] : [14, 8, 26]); }
  // tourbillon de la couleur du donjon dans l'ouverture
  for (let y = base - 34; y < base - 14; y++) for (let x = cx - 11; x <= cx + 11; x++) {
    const nx = (x + 0.5 - cx) / 11, ny = (y + 0.5 - (base - 22)) / 12; if (nx * nx + ny * ny > 1 && y < base - 22) continue; if (Math.abs(nx) > 1) continue;
    const a = Math.atan2(ny, nx), d = Math.hypot(nx, ny), sw = Math.sin(a * 3 + d * 8 - f * Math.PI / 2);
    P.set(x, y, sw > 0.35 ? tr[3] : sw > -0.3 ? tr[1] : [18, 10, 34]);
  }
  // linteau + piliers
  const pil = (px) => { for (let y = base - 40; y < base - 6; y++) for (let x = px - 3; x <= px + 3; x++) { const edge = x === px - 3 || x === px + 3; P.set(x, y, edge ? STONE[0] : x < px ? STONE[4] : x === px ? STONE[3] : STONE[2]); if ((y - base) % 7 === 0) P.set(x, y, STONE[1]); } for (let x = px - 4; x <= px + 4; x++) { P.set(x, base - 41, STONE[4]); P.set(x, base - 40, STONE[2]); P.set(x, base - 7, STONE[2]); } };
  pil(cx - 15); pil(cx + 15);
  for (let x = cx - 18; x <= cx + 18; x++) { P.set(x, base - 44, STONE[5]); P.set(x, base - 43, STONE[4]); P.set(x, base - 42, STONE[3]); P.set(x, base - 41, STONE[2]); }
  // runes lumineuses sur les piliers
  for (const px of [cx - 15, cx + 15]) for (let k = 0; k < 4; k++) P.set(px, base - 34 + k * 7, tr[4 - (k + f) % 2]);
  // garnitures dorées au rang légendaire
  if (tier === 4) { for (let x = cx - 18; x <= cx + 18; x += 2) P.set(x, base - 44, gold[3]); for (const px of [cx - 15, cx + 15]) for (let y = base - 40; y < base - 6; y += 3) { P.set(px - 3, y, gold[2]); P.set(px + 3, y, gold[1]); } }
  if (tier >= 3) for (const px of [cx - 15, cx + 15]) { P.set(px - 4, base - 46, STONE[3]); P.set(px + 4, base - 46, STONE[3]); }
  // gemme clé de voûte
  for (const [x, y, c] of [[cx, base - 49, 4], [cx - 1, base - 48, 3], [cx, base - 48, 4], [cx + 1, base - 48, 2], [cx - 2, base - 47, 3], [cx - 1, base - 47, 3], [cx, base - 47, 2], [cx + 1, base - 47, 1], [cx + 2, base - 47, 1], [cx - 1, base - 46, 2], [cx, base - 46, 1], [cx + 1, base - 46, 1], [cx, base - 45, 0]]) P.set(x, y, tr[c]);
  P.outline([30, 18, 46]);
  return P.done();
}
// faisceau visible de loin (taille selon la rareté)
function beam(x, yTop, yBot, col, w, t) {
  const c = hex(col);
  for (let y = yTop; y < yBot; y += 4) {
    const k = (y - yTop) / (yBot - yTop), a = 0.08 + 0.3 * k;
    g.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a})`; g.fillRect(x - w / 2, y, w, 4);
    g.fillStyle = `rgba(255,255,255,${a * 0.6})`; g.fillRect(x - w / 6, y, w / 3, 4);
  }
  const r = C.mulberry32(t * 31 + 7);
  for (let i = 0; i < 14; i++) { const px = x - w + r() * w * 2, py = yTop + r() * (yBot - yTop); g.fillStyle = col; g.fillRect(Math.round(px / 4) * 4, Math.round(py / 4) * 4, 4, 4); }
}

/* ---------- labyrinthe (même algorithme que le jeu utiliserait) ---------- */
function maze(n, seed, loops) {
  const r = C.mulberry32(seed), N = 3 * n + 1, t = Array.from({ length: N }, () => new Uint8Array(N).fill(1));
  const open = (cx, cy) => { for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) t[3 * cy + 1 + y][3 * cx + 1 + x] = 0; };
  const link = (ax, ay, bx, by) => { if (bx !== ax) { const wx = 3 * Math.max(ax, bx); for (let k = 1; k <= 2; k++) t[3 * ay + k][wx] = 0; } else { const wy = 3 * Math.max(ay, by); for (let k = 1; k <= 2; k++) t[wy][3 * ax + k] = 0; } };
  const seen = new Uint8Array(n * n), start = [n >> 1, n - 1], st = [start]; seen[start[1] * n + start[0]] = 1; open(...start);
  const adj = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (st.length) {
    const [cx, cy] = st[st.length - 1], nb = adj.map(([a, b]) => [cx + a, cy + b]).filter(([x, y]) => x >= 0 && y >= 0 && x < n && y < n && !seen[y * n + x]);
    if (!nb.length) { st.pop(); continue; }
    const [nx, ny] = nb[Math.floor(r() * nb.length)]; seen[ny * n + nx] = 1; open(nx, ny); link(cx, cy, nx, ny); st.push([nx, ny]);
  }
  for (let cy = 0; cy < n; cy++) for (let cx = 0; cx < n; cx++) for (const [a, b] of [[1, 0], [0, 1]]) if (cx + a < n && cy + b < n && r() < loops) link(cx, cy, cx + a, cy + b);
  // distances depuis l'entrée ; boss = cellule la plus lointaine, salle 2×2
  const dist = new Int32Array(n * n).fill(-1), q = [start]; dist[start[1] * n + start[0]] = 0;
  while (q.length) { const [cx, cy] = q.shift(); for (const [a, b] of adj) { const x = cx + a, y = cy + b; if (x < 0 || y < 0 || x >= n || y >= n || dist[y * n + x] >= 0) continue; const wx = a ? 3 * Math.max(cx, x) : 3 * cx + 1, wy = b ? 3 * Math.max(cy, y) : 3 * cy + 1; if (t[wy][wx]) continue; dist[y * n + x] = dist[cy * n + cx] + 1; q.push([x, y]); } }
  let boss = start, bd = -1; for (let i = 0; i < n * n; i++) if (dist[i] > bd) { bd = dist[i]; boss = [i % n, (i / n) | 0]; }
  const bx = clamp(boss[0], 0, n - 2), by = clamp(boss[1], 0, n - 2);
  for (let y = 3 * by + 1; y <= 3 * by + 5; y++) for (let x = 3 * bx + 1; x <= 3 * bx + 5; x++) t[y][x] = 0;
  const ends = []; for (let cy = 0; cy < n; cy++) for (let cx = 0; cx < n; cx++) { let k = 0; for (const [a, b] of adj) { const x = cx + a, y = cy + b; if (x < 0 || y < 0 || x >= n || y >= n) continue; const wx = a ? 3 * Math.max(cx, x) : 3 * cx + 1, wy = b ? 3 * Math.max(cy, y) : 3 * cy + 1; if (!t[wy][wx]) k++; } if (k === 1 && !(cx === start[0] && cy === start[1])) ends.push([cx, cy]); }
  return { t, N, n, start, boss: [bx, by], bd, ends, dist };
}

/* ---------- textes ---------- */
function title(y, txt, sub) {
  g.fillStyle = '#f2c94c'; g.font = 'bold 30px Georgia, serif'; g.fillText(txt, 40, y);
  if (sub) { g.fillStyle = '#c8bcdc'; g.font = 'italic 17px Georgia, serif'; g.fillText(sub, 40, y + 28); }
}
function label(x, y, txt, col, size, align, bold) { g.font = `${bold ? 'bold ' : ''}${size || 15}px Georgia, serif`; g.textAlign = align || 'center'; g.fillStyle = col || '#f4ead8'; g.fillText(txt, x, y); g.textAlign = 'left'; }
function panel(x, y, w, h) { g.fillStyle = '#1c1636'; g.fillRect(x, y, w, h); g.strokeStyle = '#f4ead8'; g.globalAlpha = 0.5; g.lineWidth = 2; g.strokeRect(x + 1, y + 1, w - 2, h - 2); g.globalAlpha = 1; }

/* ---------- rendu d'une scène de donjon en 2.5D, monde ×4, perso ×3 ---------- */
const S = 4, CP = 3;
function scene(ox, oy, vw, vh, M, tier, cam, ents, lights, opts) {
  const pal = THEME[tier], floors = [0, 1, 2, 3].map(v => paintFloor(pal, v + tier * 4)), walls = [0, 1, 2].map(v => paintWall(pal, tier, v)), cut = paintWall(pal, tier, 1, 6);
  const spikesUp = paintSpikes(true, pal), spikesDn = paintSpikes(false, pal);
  const L = document.createElement('canvas'); L.width = vw; L.height = vh; const q = L.getContext('2d'); q.imageSmoothingEnabled = false;
  q.fillStyle = '#07040e'; q.fillRect(0, 0, vw, vh);
  const iso = (x, y) => [((x - y) * 16 - cam[0]) * S + vw / 2, ((x + y) * 8 - cam[1]) * S + vh / 2];
  const N = M.N, items = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const [sx, sy] = iso(x, y); if (sx < -200 || sx > vw + 200 || sy < -260 || sy > vh + 200) continue;
    if (!M.t[y][x]) { q.drawImage(floors[C.hash(x, y) % 4], sx - 16 * S, sy, 32 * S, 16 * S); if (opts.spikes && opts.spikes.some(([a, b]) => a === x && b === y)) q.drawImage(opts.spikesUp ? spikesUp : spikesDn, sx - 16 * S, sy, 32 * S, 16 * S); }
    else if (opts.cut && x + y > opts.cut[0] + opts.cut[1] && Math.abs(x - opts.cut[0]) + Math.abs(y - opts.cut[1]) < 7) items.push({ k: x + y + 1, f: () => q.drawImage(cut, sx - 16 * S, sy - 6 * S, 32 * S, 22 * S) });
    else items.push({ k: x + y + 1, f: () => q.drawImage(walls[C.hash(y, x) % 3], sx - 16 * S, sy - WH * S, 32 * S, (16 + WH) * S) });
  }
  for (const e of ents) { const [sx, sy] = iso(e.x, e.y); items.push({ k: e.x + e.y + 0.01, f: () => e.draw(q, sx, sy + 8 * S) }); }
  items.sort((a, b) => a.k - b.k).forEach(it => it.f());
  // obscurité par blocs de pixels du monde, en bandes tramées (lumière du héros, torches, cristaux)
