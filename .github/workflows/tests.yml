name: Tests

# Tests du moteur partagé (client/content.js + client/core.js) : aucune dépendance à installer.
on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/build-preview.js
